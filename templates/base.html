<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased">
    <nav class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold">{{ app_name }}</a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user %}
                        <a href="/wishlist" class="hover:text-gray-300">My Wishlist</a>
                        <a href="/auth/logout" class="bg-red-500 text-white px-3 py-2 rounded-md font-medium hover:bg-red-600">Logout</a>
                    {% else %}
                        <a href="/auth/login" class="hover:text-gray-300">Login</a>
                        <a href="/auth/register" class="bg-white text-blue-600 px-3 py-2 rounded-md font-medium hover:bg-gray-100">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white mt-12 border-t border-gray-200">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">
                &copy; 2026 {{ app_name }}. All rights reserved.
            </p>
        </div>
    </footer>
</body>
</html>
