{% extends "base.html" %}

{% block content %}
<div class="text-center py-12">
    <h1 class="text-4xl font-extrabold text-gray-900 sm:text-5xl md:text-6xl">
        Find the Best PC Game Deals
    </h1>
    <p class="mt-4 max-w-2xl text-xl text-gray-500 mx-auto">
        Track prices, set alerts, and never miss a drop on your favorite games across Steam, GOG, Epic, and more.
    </p>

    <div class="mt-8 flex justify-center">
        <div class="w-full max-w-lg relative text-gray-400 focus-within:text-gray-600">
            <svg class="pointer-events-none absolute left-4 top-3.5 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input 
                type="text" 
                name="query"
                hx-get="/deals/search"
                hx-trigger="keyup changed delay:500ms"
                hx-target="#search-results"
                class="block w-full rounded-full border-gray-300 pl-11 pr-4 py-3 bg-white shadow-sm focus:border-blue-500 focus:ring-blue-500 text-gray-900 placeholder-gray-500" 
                placeholder="Search for a game (e.g. Cyberpunk 2077)..."
            >
        </div>
    </div>
</div>

<div id="search-results" class="mt-8">
    <!-- Results will be injected here via HTMX -->
</div>
{% endblock %}
